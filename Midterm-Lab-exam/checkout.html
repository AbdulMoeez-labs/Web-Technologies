<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | ESSENTIA</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>

<body>

<header class="site-header">
  <nav class="navbar navbar-dark">
    <div class="container">
      <a class="navbar-brand brand" href="index.html">ESSENTIA</a>
      <a class="nav-link" href="index.html">Continue Shopping</a>
    </div>
  </nav>
</header>

<main class="container py-5">
  <h1 class="text-center mb-4">Checkout</h1>

  <form action="#" method="get" class="checkout-form">

    <div class="checkout-grid">

      <fieldset>
        <legend>Contact</legend>

        <div class="form-row">
          <label for="fullname">Full Name</label>
          <div>
            <input type="text" id="fullname" name="fullname"
                   placeholder="Enter full name" required
                   minlength="3">
            <small>Please enter your full name.</small>
          </div>
        </div>

        <div class="form-row">
          <label for="email">Email</label>
          <div>
            <input type="email" id="email" name="email"
                   placeholder="Enter email" required>
            <small>Please enter a valid email address.</small>
          </div>
        </div>

        <div class="form-row">
          <label for="phone">Phone</label>
          <div>
            <input type="tel" id="phone" name="phone"
                   placeholder="03XX-XXXXXXX"
                   pattern="03[0-9]{2}-[0-9]{7}"
                   title="Use 03XX-XXXXXXX"
                   required>
            <small>Use format 03XX-XXXXXXX.</small>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Delivery</legend>

        <div class="form-row">
          <label for="address">Address</label>
          <div>
            <input type="text" id="address" name="address"
                   placeholder="Enter delivery address" required>
            <small>Please enter your address.</small>
          </div>
        </div>

        <div class="form-row">
          <label for="city">City</label>
          <div>
            <select id="city" name="city" required>
              <option value="" selected disabled>Select City</option>
              <option value="Lahore">Lahore</option>
              <option value="Karachi">Karachi</option>
              <option value="Islamabad">Islamabad</option>
              <option value="Rawalpindi">Rawalpindi</option>
              <option value="Faisalabad">Faisalabad</option>
            </select>
            <small>Please select a city.</small>
          </div>
        </div>

        <div class="form-row">
          <label for="date">Delivery Date</label>
          <div>
            <input type="date" id="date" name="date"
                   min="2026-10-29"
                   max="2026-10-31"
                   required>
            <small>Choose October 29–31, 2026.</small>
          </div>
        </div>
      </fieldset>

    </div>

    <button type="submit" class="checkout-submit">
      Place Order
    </button>

  </form>
</main>

</body>
</html>
